<html>
    <head><script type="module" src="index.js"></script>
        <style>
            html, body {
                margin: 0;
                height: 100%;
                background: #0a0a10;
                font-family: ui-sans-serif, system-ui, sans-serif;
                color: #ddd;
            }
            canvas {
                display: block;
                width: 100%;
                height: 100%;
                cursor: grab;
            }
            #tooltip {
                position: fixed;
                display: none;
                pointer-events: none;
                padding: 6px 8px;
                background: rgba(20, 22, 28, 0.92);
                border: 1px solid #333;
                border-radius: 4px;
                font-size: 12px;
                line-height: 1.4;
                white-space: nowrap;
                z-index: 10;
            }
            #hint {
                position: fixed;
                bottom: 8px;
                right: 12px;
                font-size: 11px;
                color: #666;
                pointer-events: none;
            }
        </style>
    </head>
    <body>
        <canvas></canvas>
        <div id="tooltip"></div>
        <div id="hint">drag to pan · wheel to zoom · double-click to reset</div>
    </body>
</html>
